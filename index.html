<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Bucket List</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="container">
        <center>
            <h1>Dream Bucket List</h1>
            <p class="subtitle">Create, Track & Celebrate Your Goals</p><br>
        

        <input type="text" id="goalInput" placeholder="Enter your goal">

        <button id="addBtn">Add Goal</button><br><br></center>

        <div class="progress-box">
            <p>Progress: <span id="progressPercent">0%</span></p>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </div>

        <div class="stats">
            <div class="card">
                <h3>Total</h3>
                <p id="totalGoals">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedGoals">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingGoals">0</p>
            </div>
        </div>

        <ul id="goalList"></ul>

    </div>

    <script src="index.js"></script>

</body>
</html>
